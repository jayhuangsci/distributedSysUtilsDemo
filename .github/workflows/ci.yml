name: Java Hadoop verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build and test
        run: ./mvnw --batch-mode verify
      - name: Verify checked-in result examples
        run: |
          test -f target/hadoop-corpus-pipeline-2.0.0.jar
      - name: Run the raw-text corpus demo
        run: |
          ./scripts/run.sh demo sample_input/raw-documents.txt target/demo-smoke
          ./scripts/run.sh prepare --input sample_input/documents --input-mode files --output target/files-demo
          ./scripts/run.sh inspect target/files-demo
          ./scripts/benchmark.sh 100 4 3
      - name: Verify the container demo
        run: |
          docker build --tag ratings-lab:ci .
          docker run --rm ratings-lab:ci
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-evidence
          path: |
            target/surefire-reports/
            target/pipeline-evidence/
            target/demo-smoke/
            target/files-demo/
            benchmark-output/
